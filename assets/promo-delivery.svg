    </linearGradient>
    <radialGradient id="glowD" cx="85%" cy="25%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="300" rx="24" fill="url(#bgD)"/>
  <rect width="1200" height="300" rx="24" fill="url(#glowD)"/>
  <circle cx="1080" cy="60" r="120" fill="#FFFFFF" opacity="0.08"/>
  <circle cx="1150" cy="250" r="90" fill="#FFFFFF" opacity="0.08"/>
